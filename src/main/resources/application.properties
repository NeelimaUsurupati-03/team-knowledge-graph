spring.application.name=team-knowledge-graph

# CognoDB connection (values come from environment variables, never hardcoded)
spring.neo4j.uri=${COGNODB_URI}
spring.neo4j.authentication.username=cognodb
spring.neo4j.authentication.password=${COGNODB_PASSWORD}

server.port=8080

# Actuator health endpoint - useful for showing DB connectivity status
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health