<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Knowledge Graph</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1225;--navy-light:#1A1E3A;--navy-lighter:#262B52;--teal:#14B88A;--teal-dim:#0F6E56;--teal-glow:rgba(20,184,138,0.15);--coral:#FF6B4A;--coral-glow:rgba(255,107,74,0.15);--purple:#8B7FF0;--purple-glow:rgba(139,127,240,0.15);--bg:#F7F8FA;--text:#14162B;--text-muted:#767B94;--border:#E8E9F0;--card:#ffffff}
body{font-family:'Manrope',Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.layout{display:flex;min-height:100vh}
aside{width:232px;background:var(--navy);color:#ccc;padding:28px 16px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
aside .brand{color:white;font-size:18px;font-weight:800;margin-bottom:32px;padding:0 10px;display:flex;align-items:center;gap:8px}
aside .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);flex-shrink:0}
aside a{color:#9498b0;text-decoration:none;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px}
aside a:hover{background:var(--navy-lighter);color:white}
aside a.active{background:var(--teal);color:var(--navy);font-weight:700}
main{flex:1;padding:36px 44px;max-width:1040px}
h2{font-size:24px;font-weight:800;margin-bottom:4px}
.subtitle{color:var(--text-muted);font-size:14px;margin-bottom:26px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px}
.stat.teal::before{background:var(--teal)}.stat.coral::before{background:var(--coral)}.stat.purple::before{background:var(--purple)}
.stat .num{font-size:34px;font-weight:800}.stat .label{font-size:13px;color:var(--text-muted);margin-top:3px}
.stat.teal .num{color:var(--teal-dim)}.stat.coral .num{color:var(--coral)}.stat.purple .num{color:var(--purple)}
form.inline{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
form.inline input, form.inline select{flex:1;min-width:140px;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;outline:none}
form.inline button{padding:10px 20px;border-radius:8px;border:none;background:var(--navy);color:white;font-size:14px;cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:5px}
.card p.meta{font-size:13px;color:var(--text-muted);margin-bottom:10px}
.card .id{font-size:10px;color:#c3c5d3;font-family:'JetBrains Mono',monospace;word-break:break-all;cursor:pointer}
.card .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.card .actions select{padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;flex:1}
.card .actions button{padding:6px 12px;border-radius:6px;border:none;background:var(--navy);color:white;font-size:12px;cursor:pointer}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.badge.teal{background:var(--teal-glow);color:var(--teal-dim)}.badge.coral{background:var(--coral-glow);color:var(--coral)}.badge.purple{background:var(--purple-glow);color:var(--purple)}
.section{display:none}.section.active{display:block}
.empty{color:var(--text-muted);text-align:center;padding:48px 20px;font-size:14px}
.spinner-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 20px;color:var(--text-muted);font-size:13px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.explore-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px}
.explore-box .result-block{margin-top:18px}
.explore-box .result-block h4{font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:10px;font-weight:700}
.person-chip,.task-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;margin:3px 6px 3px 0}
.person-chip{background:var(--teal-glow);color:var(--teal-dim)}.task-chip{background:var(--coral-glow);color:var(--coral)}
.assign-panel{background:#F0FAF6;border:1px dashed var(--teal);border-radius:12px;padding:16px;margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
</style>
</head>
<body>
<div class="layout">
<aside>
<div class="brand"><span class="dot"></span>Team<span style="color:var(--teal)">Graph</span></div>
<a onclick="showSection('dashboard')" class="active" id="nav-dashboard">◈ Dashboard</a>
<a onclick="showSection('people')" id="nav-people">◐ People</a>
<a onclick="showSection('projects')" id="nav-projects">◧ Projects</a>
<a onclick="showSection('tasks')" id="nav-tasks">◫ Tasks</a>
<a onclick="showSection('skills')" id="nav-skills">◆ Skills</a>
<a onclick="showSection('explore')" id="nav-explore">⟡ Explore graph</a>
</aside>
<main>
<div class="section active" id="dashboard"><h2>Dashboard</h2><p class="subtitle">Overview</p><div id="dashboard-content"></div></div>
<div class="section" id="people"><h2>People</h2><form class="inline" onsubmit="addPerson(event)"><input id="p-name" placeholder="Name" required><input id="p-role" placeholder="Role" required><input id="p-email" placeholder="Email" required><button type="submit">Add person</button></form><div id="people-list" class="grid"></div></div>
<div class="section" id="projects"><h2>Projects</h2><form class="inline" onsubmit="addProject(event)"><input id="pr-name" placeholder="Name" required><input id="pr-desc" placeholder="Description" required><input id="pr-status" placeholder="Status" required><button type="submit">Add project</button></form><div id="projects-list" class="grid"></div></div>
<div class="section" id="tasks"><h2>Tasks</h2><form class="inline" onsubmit="addTask(event)"><input id="t-title" placeholder="Title" required><input id="t-status" placeholder="Status" required><input id="t-priority" placeholder="Priority" required><button type="submit">Add task</button></form><div id="tasks-list" class="grid"></div></div>
<div class="section" id="skills"><h2>Skills</h2><form class="inline" onsubmit="addSkill(event)"><input id="s-name" placeholder="Skill name" required><button type="submit">Add skill</button></form><div id="skills-list" class="grid"></div></div>
<div class="section" id="explore"><h2>Explore graph</h2><p class="subtitle">See who can help - Now assign from UI</p><div class="explore-box"><form class="inline" style="margin-bottom:0" onsubmit="exploreTask(event)"><input id="ex-taskid" placeholder="Paste a Task ID" required><button type="submit">Explore</button></form><div id="explore-results"></div><div id="assign-area"></div></div></div>
</main>
</div>
<script>
const API='https://teamknowledgegraph-backend.onrender.com/api';
let allPersons=[], allSkills=[], currentTaskId=null;
function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('aside a').forEach(a=>a.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('nav-'+id).classList.add('active');if(id==='dashboard')loadDashboard();if(id==='people')loadPeople();if(id==='projects')loadProjects();if(id==='tasks')loadTasks();if(id==='skills')loadSkills();if(id==='explore')preload();}
async function preload(){try{const [p,s]=await Promise.all([fetch(API+'/persons/getAllPersons').then(r=>r.json()), fetch(API+'/skill/getAllSkill').then(r=>r.json())]);allPersons=p; allSkills=s;}catch(e){}}
async function loadDashboard(){const el=document.getElementById('dashboard-content');try{const [people,projects,tasks]=await Promise.all([fetch(API+'/persons/getAllPersons').then(r=>r.json()),fetch(API+'/projects/getAllProject').then(r=>r.json()),fetch(API+'/task/getAllTasks').then(r=>r.json())]);el.innerHTML=`<div class="stat-row"><div class="stat teal"><div class="num">${people.length}</div><div class="label">People</div></div><div class="stat coral"><div class="num">${projects.length}</div><div class="label">Projects</div></div><div class="stat purple"><div class="num">${tasks.length}</div><div class="label">Tasks</div></div></div>`;}catch(e){el.innerHTML='<div class="empty">Backend waking up... wait 30 sec and refresh.</div>';}}
async function loadPeople(){const el=document.getElementById('people-list');el.innerHTML='Loading...';try{await preload();el.innerHTML=allPersons.map(p=>`<div class="card"><h3>${p.name}</h3><p class="meta">${p.role||''} · ${p.email||''}</p><div class="id" onclick="navigator.clipboard.writeText('${p.id}');alert('Copied')">${p.id}</div><div class="actions"><select id="skill-for-${p.id}"><option value="">Select skill</option>${allSkills.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><button onclick="linkPersonSkill('${p.id}')">Add Skill</button></div></div>`).join('');}catch(e){el.innerHTML='Error';}}
async function linkPersonSkill(personId){const skillId=document.getElementById('skill-for-'+personId).value;if(!skillId){alert('Select skill');return;}const res=await fetch(API+`/persons/addSkill/${personId}/${skillId}`,{method:'POST'});if(res.ok)alert('Skill added!');else alert('Failed');}
async function addPerson(e){e.preventDefault();const body={name:document.getElementById('p-name').value,role:document.getElementById('p-role').value,email:document.getElementById('p-email').value};await fetch(API+'/persons/addPerson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();await preload();loadPeople();}
async function loadProjects(){try{const res=await fetch(API+'/projects/getAllProject');const data=await res.json();document.getElementById('projects-list').innerHTML=data.map(p=>`<div class="card"><h3>${p.name}</h3><p class="meta">${p.description||''}</p><span class="badge coral">${p.status||'Active'}</span></div>`).join('');}catch(e){}}
async function addProject(e){e.preventDefault();const body={name:document.getElementById('pr-name').value,description:document.getElementById('pr-desc').value,status:document.getElementById('pr-status').value};await fetch(API+'/projects/addProject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();loadProjects();}
async function loadTasks(){try{const res=await fetch(API+'/task/getAllTasks');const data=await res.json();document.getElementById('tasks-list').innerHTML=data.map(t=>`<div class="card"><h3>${t.title}</h3><p class="meta">Priority: ${t.priority||'Normal'}</p><span class="badge purple">${t.status||'Open'}</span><div class="id" onclick="document.getElementById('ex-taskid').value='${t.id}';showSection('explore');exploreTaskDirect('${t.id}')" style="margin-top:10px;background:#f0f0f0;padding:6px;border-radius:6px">ID: ${t.id} (click to explore)</div></div>`).join('');}catch(e){}}
async function addTask(e){e.preventDefault();const body={title:document.getElementById('t-title').value,status:document.getElementById('t-status').value,priority:document.getElementById('t-priority').value};await fetch(API+'/task/addTask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();loadTasks();}
async function loadSkills(){try{await preload();document.getElementById('skills-list').innerHTML=allSkills.map(s=>`<div class="card"><h3>${s.name}</h3><div class="id">${s.id}</div><span class="badge teal">Skill</span></div>`).join('');}catch(e){}}
async function addSkill(e){e.preventDefault();const body={name:document.getElementById('s-name').value};await fetch(API+'/skill/addSkill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});e.target.reset();await preload();loadSkills();}
async function exploreTaskDirect(taskId){currentTaskId=taskId;const el=document.getElementById('explore-results');const assignEl=document.getElementById('assign-area');el.innerHTML='Searching...';try{await preload();const [helpers,blockers]=await Promise.all([fetch(API+'/task/whoCanHelp/'+taskId).then(r=>r.json()),fetch(API+'/task/blockers/'+taskId).then(r=>r.json())]);el.innerHTML=`<div class="result-block"><h4>Who can help (${helpers.length})</h4>${helpers.length?helpers.map(p=>`<span class="person-chip">${p.name} · ${p.role||''}</span>`).join(''):'<span style="color:#767B94">No one found - assign below</span>'}</div><div class="result-block"><h4>Blocked by (${blockers.length})</h4>${blockers.length?blockers.map(t=>`<span class="task-chip">${t.title}</span>`).join(''):'No blockers'}</div>`;assignEl.innerHTML=`<div class="assign-panel"><div><label style="font-size:12px;font-weight:700">Assign Person Directly</label><br><select id="assign-person" style="padding:8px;border-radius:8px;border:1px solid #ddd;min-width:180px"><option value="">Select Person</option>${allPersons.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><button onclick="assignPersonToTask()" style="padding:9px 16px;border-radius:8px;border:none;background:var(--navy);color:white;font-weight:600;cursor:pointer">Assign Person</button></div><div class="assign-panel"><div><label style="font-size:12px;font-weight:700">Add Skill to this Task</label><br><select id="assign-skill" style="padding:8px;border-radius:8px;border:1px solid #ddd;min-width:180px"><option value="">Select Skill</option>${allSkills.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><button onclick="assignSkillToTask()" style="padding:9px 16px;border-radius:8px;border:none;background:var(--teal);color:white;font-weight:600;cursor:pointer">Add Skill to Task</button></div>`;}catch(e){el.innerHTML='Error. Check Task ID.';}}
function exploreTask(e){e.preventDefault();const taskId=document.getElementById('ex-taskid').value.trim();exploreTaskDirect(taskId);}
async function assignPersonToTask(){const personId=document.getElementById('assign-person').value;if(!personId){alert('Select person');return;}const res=await fetch(API+`/persons/${personId}/assignTask/${currentTaskId}`,{method:'POST'});if(res.ok){alert('Assigned!');exploreTaskDirect(currentTaskId);}else alert('Failed');}
async function assignSkillToTask(){const skillId=document.getElementById('assign-skill').value;if(!skillId){alert('Select skill');return;}const res=await fetch(API+`/task/addSkill/${currentTaskId}/${skillId}`,{method:'POST'});if(res.ok){alert('Skill added to task!');exploreTaskDirect(currentTaskId);}else alert('Failed');}
loadDashboard();preload();
</script>
</body>
</html>
